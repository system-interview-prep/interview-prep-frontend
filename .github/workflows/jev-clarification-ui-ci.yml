name: Jev Clarification UI CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/jev-clarification-ui
    paths:
      - "src/features/matching/**"
      - "src/features/admin/services/jobProfile.service.ts"
      - "src/features/resume/**"
      - "src/lib/aiService.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/jev-clarification-ui-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.10.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: pnpm build
